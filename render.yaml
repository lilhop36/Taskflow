# Render Blueprint — deploy the TaskFlow backend as a Web Service.
#
# How to use:
#   1. Push this repo to GitHub (Render needs a Git remote).
#   2. In Render: New → Blueprint → select this repo → Render reads this file.
#   3. Fill in the secret env vars (sync: false below) in the Render dashboard:
#        MONGODB_URI       — Atlas connection string
#        JWT_ACCESS_SECRET — openssl rand -hex 32
#        JWT_REFRESH_SECRET
#        CORS_ORIGIN       — your deployed frontend, e.g. https://taskflow.vercel.app
#   4. Deploy. Render injects PORT automatically (main.ts reads process.env.PORT).
#
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).

services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: taskflow/backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
