name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · lint, test, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Lint is advisory (not a gate) while ~260 pre-existing type-aware
      # errors are cleaned up; tests + build are the real gates. See
      # docs/DEPLOYMENT.md for the lint-debt cleanup task.
      - name: Lint (advisory)
        run: npm run lint --workspace backend
        continue-on-error: true

      - name: Unit tests (uses in-memory MongoDB)
        run: npm test --workspace backend -- --runInBand

      - name: Build
        run: npm run build --workspace backend

      - name: E2E smoke tests (uses in-memory MongoDB)
        run: npm run test:e2e --workspace backend

  frontend:
    name: Frontend · lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Build (type-checks the App Router pages)
        run: npm run build --workspace frontend
